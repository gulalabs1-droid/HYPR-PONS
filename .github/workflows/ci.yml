name: HYPR verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Client bundle security check
        run: npm run security:smoke
      - name: Start production server
        run: npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/hypr-next.log 2>&1 &
      - name: Runtime smoke
        env:
          HYPR_SMOKE_EXPECT_UNCONFIGURED: "1"
        run: npm run smoke -- http://127.0.0.1:3100

  protocol:
    name: Foundry checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Format check
        working-directory: protocol
        run: forge fmt --check
      - name: Build contracts
        working-directory: protocol
        run: forge build
      - name: Run local protocol tests
        working-directory: protocol
        run: forge test
