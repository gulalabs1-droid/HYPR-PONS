name: Show reminders

# Sends "starts soon" push notifications for shows beginning in the next 15
# minutes. Each show is announced once (the database records it), so overlapping
# or retried runs are safe. Inactive until both repository secrets are set:
#   HYPR_APP_URL  e.g. https://hypr-pons.vercel.app
#   CRON_SECRET   the same value as the CRON_SECRET environment variable on Vercel
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger reminders
        env:
          APP_URL: ${{ secrets.HYPR_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Reminder secrets not configured; skipping."; exit 0; fi
          curl --fail --silent --show-error --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/show-reminders"
